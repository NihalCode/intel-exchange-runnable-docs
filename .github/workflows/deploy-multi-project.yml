name: Multi-project build matrix

on:
  pull_request:
  push:
    branches:
      - main
      - "enterprise/**"

permissions:
  contents: read

jobs:
  build-products:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product: [ctix, cftr, csap, orchestrate]
    name: Build (${{ matrix.product }})
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build pinned product deployment
        env:
          AUTH_DISABLED: "true"
          APP_PRODUCT_ID: ${{ matrix.product }}
          VECTOR_NAMESPACE: product-${{ matrix.product }}
        run: npm run build
