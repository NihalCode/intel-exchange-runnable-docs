name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "enterprise/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan for secrets
        run: npm run security:scan-secrets

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      # AUTH_DISABLED makes the build independent of live Auth0 credentials.
      # No DATABASE_URL is provided: the app uses its local SQLite fallback.
      - name: Build
        env:
          AUTH_DISABLED: "true"
        run: npm run build
